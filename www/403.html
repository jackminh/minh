<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - 禁止访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        .container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #ffeaea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        
        .error-title {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            position: relative;
            z-index: 1;
        }
        
        .error-message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }
        
        .warning-box {
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border-left: 5px solid #ff6b6b;
            text-align: left;
            position: relative;
            z-index: 1;
        }
        
        .warning-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .warning-header i {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .warning-header h3 {
            font-size: 20px;
            margin: 0;
        }
        
        .warning-content p {
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            min-width: 160px;
        }
        
        .btn-primary {
            background: #fff;
            color: #f5576c;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-tertiary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn i {
            margin-right: 8px;
            font-size: 18px;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 1;
        }
        
        .permission-list {
            max-width: 600px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .permission-list h3 {
            margin-bottom: 15px;
            font-size: 18px;
            opacity: 0.9;
            display: flex;
            align-items: center;
        }
        
        .permission-list h3 i {
            margin-right: 10px;
        }
        
        .permission-list ul {
            list-style: none;
            padding-left: 0;
        }
        
        .permission-list li {
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }
        
        .permission-list li:last-child {
            border-bottom: none;
        }
        
        .permission-list i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        .fa-check {
            color: #4cd964;
        }
        
        .fa-times {
            color: #ff3b30;
        }
        
        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            opacity: 0.7;
            position: relative;
            z-index: 1;
        }
        
        .contact-info a {
            color: #fff;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .error-code {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 28px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .warning-box {
                padding: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-ban"></i>
        </div>
        <div class="error-code">403</div>
        <h1 class="error-title">访问被拒绝</h1>
        
        <p class="error-message">
            抱歉，您没有权限访问此页面。
        </p>
    </div>
</body>
</html>
